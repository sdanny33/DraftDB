<!DOCTYPE html>
<!-- This page is adapted from w3schools "How to make a link tree website https://www.w3schools.com/howto/howto_website_create_linktree.asp" -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel Soares</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="main-text-color">
  <div class="container"></div>
  <div class="intro">
    <div id="table-slot">Loading table...</div>
  </div>
  <script>
    fetch('table.html')
      .then(function (response) { return response.text(); })
      .then(function (html) {
        document.getElementById('table-slot').innerHTML = html;
      })
      .catch(function () {
        document.getElementById('table-slot').textContent = 'Table could not be loaded.';
      });
  </script>
  <script type="text/javascript" src="js/slider.js"></script>
</body>

</html>
